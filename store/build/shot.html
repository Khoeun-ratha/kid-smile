<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;font-weight:800;src:url(../../mobile/assets/google_fonts/Baloo2-ExtraBold.ttf)}
@font-face{font-family:B;font-weight:600;src:url(../../mobile/assets/google_fonts/Baloo2-SemiBold.ttf)}

<div class="bub" style="width:240px;height:240px;right:-80px;top:1250px"></div>
