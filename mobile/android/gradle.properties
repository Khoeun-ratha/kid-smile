org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a Windows-only Kotlin incremental compiler bug where it fails
# to relativize paths when the project (D:) and Pub Cache (C:) are on
# different drives ("this and base files have different roots").
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Low-RAM machine: compile Kotlin inside the Gradle daemon instead of
# spawning a separate Kotlin daemon JVM.
kotlin.compiler.execution.strategy=in-process
