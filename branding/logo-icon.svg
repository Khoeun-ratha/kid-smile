<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CC4FF"/>
      <stop offset="1" stop-color="#3D97F0"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFF08A"/>
      <stop offset="0.55" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FFB72B"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
    <clipPath id="mouth">
      <path d="M362 586 C362 586 662 586 662 586 C652 742 372 742 362 586 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
  <!-- background -->
  <rect width="1024" height="1024" rx="224" fill="url(#sky)"/>
  <!-- soft bubbles like the app background -->
  <circle cx="150" cy="190" r="70" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="880" cy="860" r="110" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="120" cy="840" r="46" fill="#FFFFFF" opacity="0.2"/>
  <!-- sun rays -->
  <g fill="#FFD84D">
    <g transform="translate(512 530)">
      <rect x="-26" y="-372" width="52" height="88" rx="26"/>
      <rect x="-26" y="-372" width="52" height="88" rx="26" transform="rotate(45)"/>
      <rect x="-26" y="-372" width="52" height="88" rx="26" transform="rotate(90)"/>
      <rect x="-26" y="-372" width="52" height="88" rx="26" transform="rotate(-45)"/>
      <rect x="-26" y="-372" width="52" height="88" rx="26" transform="rotate(-90)"/>
      <rect x="-26" y="-372" width="52" height="88" rx="26" transform="rotate(135)"/>
      <rect x="-26" y="-372" width="52" height="88" rx="26" transform="rotate(-135)"/>
    </g>
  </g>

  <!-- smiling sun face -->
  <circle cx="512" cy="530" r="262" fill="url(#face)"/>
  <circle cx="512" cy="530" r="262" fill="none" stroke="#F5A623" stroke-width="10" opacity="0.5"/>
  <!-- happy eyes -->
  <g fill="none" stroke="#4E2A1E" stroke-width="34" stroke-linecap="round">
    <path d="M396 486 Q434 436 472 486"/>
    <path d="M552 486 Q590 436 628 486"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="364" cy="582" rx="44" ry="28" fill="#FF8A80" opacity="0.75"/>
  <ellipse cx="660" cy="582" rx="44" ry="28" fill="#FF8A80" opacity="0.75"/>
  <!-- big open smile with tongue -->
  <path d="M362 586 C362 586 662 586 662 586 C652 742 372 742 362 586 Z" fill="#5A2A22"/>
  <g clip-path="url(#mouth)">
    <ellipse cx="512" cy="712" rx="96" ry="58" fill="#FF6F61"/>
    <rect x="362" y="578" width="300" height="26" rx="10" fill="#FFFFFF"/>
  </g>
  <!-- shine -->
  <ellipse cx="418" cy="380" rx="58" ry="30" fill="#FFFFFF" opacity="0.55" transform="rotate(-30 418 380)"/>

  <!-- quiz bubble with question mark -->
  <g transform="translate(792 236)">
    <path d="M-104 0 A104 104 0 1 1 -62 84 L-118 112 L-92 52 A104 104 0 0 1 -104 0 Z" fill="#FF6F61" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
    <path d="M-34 -26 Q-34 -62 2 -62 Q38 -62 38 -30 Q38 -6 12 6 Q0 12 0 30" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="64" r="15" fill="#FFFFFF"/>
  </g>

  <!-- sparkle stars -->
  <path d="M206 360 l16 34 36 6 -26 26 6 36 -32 -18 -32 18 6 -36 -26 -26 36 -6 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M872 640 l10 21 22 4 -16 16 4 22 -20 -11 -20 11 4 -22 -16 -16 22 -4 Z" fill="#FFF3B0"/>
  <!-- green hill (in front, so the sun rises over it) -->
  <path d="M0 860 C220 770 420 800 560 860 C700 920 860 890 1024 820 L1024 800 L1024 1024 L0 1024 Z" fill="#8FD694"/>
  <path d="M0 930 C260 860 520 900 700 950 C820 985 940 975 1024 950 L1024 1024 L0 1024 Z" fill="#6CC47A"/>

  </g>
</svg>
